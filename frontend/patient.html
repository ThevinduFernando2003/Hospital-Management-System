<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Portal | ClinicPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark" style="background:#6a5af9;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-activity me-2"></i>ClinicPro Patient</a>
            <div class="d-flex gap-2">
                <span id="patient-label" class="navbar-text text-white-50 small"></span>
                <button id="logout-btn" class="btn btn-outline-light btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div id="alert" class="alert d-none" role="alert"></div>

        <ul class="nav nav-tabs mb-3" role="tablist">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-book" type="button">Book</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-appointments" type="button">My Appointments</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-documents" type="button">Documents</button></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="tab-book">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="card-title">Book an appointment</h5>
                        <p class="text-muted small">Choose a doctor, date, and free 30-minute slot.</p>
                        <form id="book-form" class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Doctor</label>
                                <select id="doctor-select" class="form-select" required></select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Date</label>
                                <input type="date" id="date-input" class="form-control" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Time slot</label>
                                <select id="slot-select" class="form-select" required>
                                    <option value="">Select date first</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary">Request booking</button>
                                <button type="button" id="load-slots-btn" class="btn btn-outline-secondary">Refresh slots</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="tab-appointments">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title mb-0">My appointments</h5>
                            <button id="refresh-appts-btn" class="btn btn-sm btn-outline-primary">Refresh</button>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>When</th>
                                        <th>Doctor</th>
                                        <th>Branch</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="appointments-body">
                                    <tr><td colspan="4" class="text-muted">Loading…</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="tab-documents">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title mb-0">Invoices & consultation notes</h5>
                            <button id="refresh-docs-btn" class="btn btn-sm btn-outline-primary">Refresh</button>
                        </div>
                        <div id="documents-list" class="list-group list-group-flush">
                            <div class="text-muted">Loading…</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="patient.js"></script>
</body>
</html>
